  <text x="500" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" letter-spacing="4" fill="#3fd0ff" filter="url(#glow)">NISHANT.EXE — PLAYER PROFILE</text>

